{{ define "shell" }}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }} · PortD</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script defer src="/static/alpine.min.js"></script>
    <script defer src="/static/alpine-ajax.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="/dashboard">Project Hub</a>
        <nav class="nav-list">
          <a class="{{ active .Path "/dashboard" }}" href="/dashboard">Overview</a>
          <p>Projects</p>
          <a class="{{ active .Path "/projects" }}" href="/projects">All projects</a>
          <a class="{{ active .Path "/projects/tracking" }}" href="/projects/tracking">Project tracking</a>
          <a class="{{ active .Path "/projects/new" }}" href="/projects/new">Add project</a>
          <p>Infrastructure</p>
          <a class="{{ active .Path "/ports" }}" href="/ports">Port table</a>
          <p>People</p>
          <a class="{{ active .Path "/interns" }}" href="/interns">Interns</a>
        </nav>
        <small>Internal use only</small>
      </aside>
      <main>
        <header class="topbar">
          <strong>{{ .Title }}</strong>
          <form method="post" action="/logout">
            <button class="button secondary">Sign out</button>
          </form>
        </header>
        <div class="content">{{ template "content" . }}</div>
      </main>
    </div>
  </body>
</html>
{{ end }}
